# Contract: Unity BehaviorParameters must match exactly
#   Behavior Name                : HormuzShip
#   Vector Observation Space Size: 9
#   Continuous Actions           : 2
#   (See ShipAgent.cs CollectObservations for observation layout)
behaviors:
  HormuzShip:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.95
        strength: 1.0
    max_steps: 500000
    time_horizon: 256
    summary_freq: 5000
    checkpoint_interval: 50000
    keep_checkpoints: 5
